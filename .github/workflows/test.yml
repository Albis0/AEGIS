name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows-only: the app links Win32 APIs (DPAPI, screen capture, media
    # keys) that have no cross-platform stand-in.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: Version agreement
        # The version is written in three files and nothing makes them agree.
        # A mismatch ships a binary whose reported version is not the one in
        # its own installer, and nothing else would notice.
        run: node scripts/version.mjs --check

      - name: Check the frontend types
        # Vite does not type-check as it builds, so without this a type
        # error in the interface ships with every step green.
        run: bun run check
        working-directory: ui

      - name: Frontend tests
        # Types are not behaviour. These cover the parts of the interface
        # that can be wrong while type-checking cleanly: markdown escaping
        # (a model answer reaches innerHTML), the shell-style history, and
        # how streamed replies are assembled.
        run: bun run test
        working-directory: ui

      - name: Build frontend
        # The Rust build embeds ui/dist, so this must run first.
        run: bun run build
        working-directory: ui

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Tool selection quality
        # Guards the core invariant: a request is offered the tools it needs
        # and no more. The budget is per model now rather than a flat twelve,
        # so what is asserted is the eval staying at 100% -- including the
        # cases where the only tool needed is a core one, which went
        # unoffered entirely until a live run caught it.
        run: cargo test -p vavis-tools --test selection_eval -- --nocapture
