name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOT: node_modules cache'lenmiyor. Kokoro (kokoro-js + onnxruntime-node ~200MB
      # native binary) optionalDependency olduğu için stale cache bunları atlıyordu ve
      # paketlenmiş app'te Kokoro kütüphanesi eksik kalıyordu. Release build'i temiz kurulum yapar.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Kokoro deps bundled
        shell: bash
        run: |
          for m in kokoro-js @huggingface/transformers onnxruntime-node; do
            if [ ! -d "node_modules/$m" ]; then echo "HATA: node_modules/$m yok — Kokoro paketlenemez"; exit 1; fi
          done
          echo "Kokoro deps present: kokoro-js, transformers, onnxruntime-node"

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run electron:build

