name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: ui

      - name: Build frontend
        run: bun run build
        working-directory: ui

      - name: Test before shipping
        run: cargo test --all

      - name: Build release binary
        run: cargo build --release -p vavis-shell

      # The frontend-embedding check only means anything in release mode, and
      # `cargo test --all` above runs in debug. 0.4.1 shipped a binary whose
      # window opened to ERR_CONNECTION_REFUSED and every step above was green.
      - name: Verify the frontend is embedded
        run: cargo test --release -p vavis-shell release_builds_embed_the_frontend

      - name: Name the artifact after the tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Copy-Item target/release/vavis.exe "vavis-$version.exe"
          # The hash goes in the release notes so downloads can be verified;
          # the binary is deliberately unsigned (see SECURITY.md).
          $hash = (Get-FileHash "vavis-$version.exe" -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -FilePath checksum.txt -Encoding utf8
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            vavis-${{ env.VERSION }}.exe
            checksum.txt
          generate_release_notes: true
