name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOT: node_modules cache'lenmiyor. Kokoro (kokoro-js + onnxruntime-node ~200MB
      # native binary) optionalDependency olduğu için stale cache bunları atlıyordu ve
      # paketlenmiş app'te Kokoro kütüphanesi eksik kalıyordu. Release build'i temiz kurulum yapar.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Audit B1 — electron-updater keys off the tag; a tag/package.json mismatch
      # ships an installer that immediately "updates" to itself or skips updates.
      - name: Tag must match package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "HATA: tag v$TAG ile package.json sürümü $PKG uyuşmuyor — önce package.json'ı güncelle."; exit 1
          fi
          node scripts/check-version.mjs

      - name: Verify Kokoro native binaries present
        shell: bash
        run: |
          # Dizin var olması yetmez — bun postinstall'ı (trustedDependencies) çalıştırıp
          # ~200MB onnxruntime native DLL'lerini İNDİRMİŞ olmalı; yoksa Kokoro çalışmaz.
          for m in kokoro-js @huggingface/transformers onnxruntime-node; do
            if [ ! -d "node_modules/$m" ]; then echo "HATA: node_modules/$m yok"; exit 1; fi
          done
          if ! ls node_modules/onnxruntime-node/bin/napi-v*/win32/x64/onnxruntime.dll >/dev/null 2>&1; then
            echo "HATA: onnxruntime native DLL'leri yok — bun postinstall atlandı (trustedDependencies kontrol et)"; exit 1
          fi
          echo "Kokoro deps + onnxruntime native DLL'leri hazır."

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run electron:build

