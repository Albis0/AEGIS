name: secrets

# A key pasted into a commit is public the moment it is pushed, and rotating
# it is the only real fix -- so the cheap win is catching it before the push
# lands. Keys are stored encrypted at runtime (DPAPI); this guards the other
# way in, which is a person in a hurry.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Scan the history a push brings, not just its final tree: a key
          # added and removed across two commits is still in the history.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
